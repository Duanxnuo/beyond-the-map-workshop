<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="RESHAPE 2027 is the 1st International Workshop on Reimagining Software Engineering Processes and Evidence in the Agent Era at FSE 2027.">
  <title>{{TITLE}} · FSE 2027 Workshop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23504657'/%3E%3Ccircle cx='32' cy='32' r='19' fill='none' stroke='%23D5C3DE' stroke-width='2'/%3E%3Ccircle cx='32' cy='32' r='4' fill='%23FAEEEE'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css?v=reshape-2027-2">
  <script src="./script.js?v=reshape-2027-1" defer></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header">
    <a class="brand" href="#top" aria-label="{{TITLE}}, back to top"><span class="brand-mark" aria-hidden="true">✳</span> {{TITLE}}<span class="brand-suffix">/ FSE 2027</span></a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="main-nav" aria-label="Open navigation">Menu <span aria-hidden="true">＋</span></button>
    <nav id="main-nav" aria-label="Main navigation">{{NAV}}</nav>
  </header>
  <main id="main">
    <section class="hero" id="top">
      <div class="hero-grid" aria-hidden="true"></div>
      <div class="hero-content">
        <span class="eyebrow hero-kicker"><span class="signal" aria-hidden="true"></span> FSE 2027 WORKSHOP</span>
        <h1>{{TITLE}}<span class="period">.</span></h1>
        <p class="hero-subtitle">{{SUBTITLE}}</p>
        <p class="hero-detail">{{DETAIL}}</p>
        <div class="hero-actions"><a class="button primary" href="#cfp">Call for Papers</a><a class="button secondary" href="#program">Explore the Program</a></div>
      </div>
      <div class="hero-orbit" aria-hidden="true"><div class="orbit orbit-a"></div><div class="orbit orbit-b"></div><div class="orbit orbit-c"></div><div class="orbit-center">●</div><div class="orbit-label one">{{ORBIT_ONE}}</div><div class="orbit-label two">{{ORBIT_TWO}}</div></div>
      <div class="hero-bottom"><span>SCROLL TO EXPLORE</span><span>01 — 11</span></div>
    </section>
    <div class="content-shell">{{SECTIONS}}</div>
  </main>
  <footer class="footer"><div><span class="footer-star">✳</span><strong>{{TITLE}}</strong><p>{{SUBTITLE}}</p></div><div class="footer-links"><a href="#top">Back to top</a><a href="#contact">Contact</a></div><small>{{TITLE}} · FSE 2027 workshop</small></footer>
</body>
</html>
